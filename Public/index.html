<!doctype html>
<html lang="en">
<head>

<title>Sanu — Private Cycle Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<div id="toast" class="toast" role="status"></div>
<div class="app-shell">
  <aside class="side-nav glass">
    <div class="brand"><div class="brand-mark">S</div><div><strong>Sanu</strong><span>private companion</span></div></div>

    <div class="nav-bottom"><button class="mini-button" id="privacyBtn">⌘ Privacy</button><small>AYUSH LOHANI<br><i>made for his sanu — Mansun</i></small></div>

  <main class="main">
    <header class="topbar">
      <div><span class="eyebrow">PRIVATE COMPANION</span><h1 id="pageTitle">Today</h1></div>
      <button class="icon-button" id="settingsBtn" aria-label="Open settings">⚙</button>
    </header>

    <section id="page-today" class="page active"></section>
    <section id="page-cycle" class="page"></section>
    <section id="page-guide" class="page"></section>
    <section id="page-ai" class="page"></section>

    <footer><div><strong>AYUSH LOHANI</strong><span>made for his sanu — Mansun</span></div><div class="footer-links"><button data-page="today">Today</button><button data-page="cycle">Cycle</button><button data-page="guide">Guide</button><button data-page="ai">Ask AI</button><button id="footerPrivacy">Privacy</button></div><p>Cycle information and predictions are estimates and are not medical advice.</p></footer>

  <nav class="bottom-nav glass" id="mobileNav"></nav>

<div class="modal" id="modal"><div class="modal-card glass"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></div></div>
